<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1B3A5C">
<meta name="apple-mobile-web-app-title" content="PRAYED">
<link rel="manifest" href="manifest.json">
<title>PRAYED - A World at Prayer</title>

<!-- Fonts: Noto Sans/Serif (primary) + Inter/Crimson Text (fallback) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700;800&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<!-- CSS (order matters) -->
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/screens.css">
<link rel="stylesheet" href="css/bible.css">
<link rel="stylesheet" href="css/dark-mode.css">
</head>
<body>

<!-- SPLASH SCREEN -->
<div id="splash">
  <div class="logo-wrap">
    <img id="splashLogo" src="" alt="HCFM">
    <div class="globe-3d" id="splashGlobe">
      <img id="splashGlobeImg" src="" alt="Earth" style="width:140px;height:140px;border-radius:50%;object-fit:cover;filter:drop-shadow(0 0 20px rgba(30,100,220,0.6)) brightness(1.1);box-shadow:0 0 30px rgba(37,99,235,0.5),inset 0 0 20px rgba(255,255,255,0.1)">
    </div>
  </div>
  <h1 id="splashTitle">PRAYED</h1>
  <p class="tagline" id="splashTagline">The Family That Prays Together Stays Together</p>
  <button class="get-started" id="splashBtn" onclick="onGetStarted()">Get Started</button>
</div>

<!-- ONBOARDING -->
<div id="onboarding">
  <div class="onb-content" id="onbContent"></div>
  <div class="onb-footer">
    <div class="onb-dots" id="onbDots"></div>
    <div style="display:flex;gap:8px">
      <button class="onb-btn secondary" id="onbBack" onclick="onbBack()" style="display:none">Back</button>
      <button class="onb-btn primary" id="onbNext" onclick="onbNext()">Next</button>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="screen" id="screenHome"></div>
  <div class="screen" id="screenPray"></div>
  <div class="screen" id="screenCircles"></div>
  <div class="screen" id="screenBible"></div>
  <div class="screen" id="screenHabits" style="display:none"></div>
  <div class="screen" id="screenProfile"></div>
</div>

<!-- BOTTOM NAV -->
<div id="bottomNav" style="display:none">
  <div class="nav-tab active" onclick="showScreen('home')" data-tab="home">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    <span>Home</span>
  </div>
  <div class="nav-tab" onclick="showScreen('pray')" data-tab="pray">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
    <span>Pray</span>
  </div>
  <div class="nav-tab" onclick="showScreen('circles')" data-tab="circles">
    <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
    <span>Circles</span>
  </div>
  <div class="nav-tab" onclick="showScreen('bible')" data-tab="bible">
    <svg viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM9 4h2v5l-1-1-1 1V4zm9 16H6V4h1v9l3-3 3 3V4h5v16z"/></svg>
    <span>Bible</span>
  </div>
  <div class="nav-tab" onclick="showScreen('profile')" data-tab="profile">
    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    <span>Profile</span>
  </div>
</div>

<!-- AUDIO BAR -->
<div id="audioBar">
  <img class="ab-thumb" id="abThumb" src="" alt="">
  <div class="ab-info">
    <div class="ab-title" id="abTitle"></div>
    <div class="ab-sub">Praying with you</div>
  </div>
  <button class="ab-btn" onclick="togglePlay(event)">
    <svg id="abPlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </button>
  <button class="ab-btn ab-close" onclick="closePlayer(event)">
    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
  </button>
</div>

<audio id="audioElement" preload="none"></audio>

<!-- AUDIO FULLSCREEN -->
<div id="audioFull">
  <div class="af-back" onclick="togglePlayerExpand()">
    <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    Back
  </div>
  <img class="af-art" id="afArt" src="" alt="">
  <div class="af-title" id="afTitle"></div>
  <div class="af-desc" id="afDesc">Join families around the world in prayer</div>
  <div class="af-progress">
    <div class="af-track"><div class="af-fill" id="afFill"></div></div>
    <div class="af-times"><span id="afTime">3:45</span><span id="afDur">12:34</span></div>
  </div>
  <div class="af-controls">
    <button onclick="seekToTime(-30)"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M12.5 5V1L7 6.5l5.5 5.5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6h-2c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg></button>
    <button onclick="togglePlay(event)"><svg id="afPlayIcon" width="48" height="48" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    <button onclick="seekToTime(30)"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg></button>
  </div>
  <div class="af-social">
    <div class="count" id="afCount"></div>
    <button class="share-btn" onclick="shareContent('prayer')">Share</button>
  </div>
</div>

<!-- VIDEO OVERLAY -->
<div id="videoOverlay">
  <div class="vo-header">
    <svg viewBox="0 0 24 24" onclick="closeVideoPlayer()"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    <span id="voTitle"></span>
  </div>
  <div class="vo-frame">
    <iframe id="voFrame" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="no-referrer-when-downgrade"></iframe>
    <div id="voFallback" style="display:none;text-align:center;padding:40px 20px">
      <svg viewBox="0 0 24 24" width="48" height="48" fill="rgba(255,255,255,0.5)" style="margin-bottom:16px"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
      <p style="color:rgba(255,255,255,0.8);margin-bottom:16px;font-size:14px">Video cannot be embedded here.</p>
      <a id="voDirectLink" href="#" target="_blank" style="display:inline-block;padding:12px 24px;background:#E53E3E;color:#fff;border-radius:12px;font-weight:600;text-decoration:none;font-size:14px">Watch on YouTube</a>
    </div>
  </div>
  <div class="vo-footer">From Family Rosary &mdash; Holy Cross Family Ministries</div>
</div>

<!-- VIDEO CALL OVERLAY (Jitsi) -->
<div id="videoCallOverlay">
  <div class="vc-header">
    <svg viewBox="0 0 24 24" onclick="closeVideoCall()"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    <span id="vcTitle">Prayer Call</span>
    <div class="vc-status" id="vcStatus"></div>
  </div>
  <div id="jitsiContainer"></div>
</div>

<!-- BROWSER OVERLAY -->
<div id="browserOverlay">
  <div class="bo-header">
    <div class="bo-back" onclick="closeInAppBrowser()">
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      Back
    </div>
    <span class="bo-url" id="boUrl"></span>
  </div>
  <iframe id="boFrame" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-top-navigation" referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>

<!-- SUB-PAGE OVERLAY -->
<div id="subPage">
  <div class="sp-header">
    <svg viewBox="0 0 24 24" onclick="closeSubPage()"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    <span id="spTitle"></span>
  </div>
  <div class="sp-body" id="spBody"></div>
</div>

<!-- AUTH MODAL -->
<div id="authModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:20000;background:rgba(0,0,0,0.5);max-width:500px;margin:0 auto">
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:90%;max-width:400px;background:var(--card-bg);border-radius:20px;padding:32px 24px;box-shadow:0 20px 60px rgba(0,0,0,0.3)">
    <button onclick="closeAuthModal()" style="position:absolute;top:12px;right:16px;font-size:24px;color:var(--text-light)">&times;</button>
    <div id="authContent"></div>
  </div>
</div>

<!-- JavaScript (order matters for global variable dependencies) -->
<script src="js/imgmap-generated.js"></script>
<script src="js/config.js"></script>
<script src="js/weather.js"></script>
<script src="js/places.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/habits.js"></script>
<script src="js/home.js"></script>
<script src="js/pray.js"></script>
<script src="js/circles.js"></script>
<script src="js/bible.js"></script>
<script src="js/profile.js"></script>
<script src="js/app.js"></script>

</body>
</html>
